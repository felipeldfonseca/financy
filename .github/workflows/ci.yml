name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The e2e suite rebuilds this database from migrations on every run.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/financy_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace backend

      - name: Build
        run: npm run build --workspace backend

      - name: Unit tests
        run: npm test --workspace backend

      - name: End-to-end tests
        run: npm run test:e2e --workspace backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace frontend

      - name: Tests
        run: npm test --workspace frontend -- --watchAll=false
        env:
          CI: true

      - name: Production build
        run: npm run build --workspace frontend
        env:
          CI: true
